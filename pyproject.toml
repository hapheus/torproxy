[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torproxy"
version = "1.5.0"
description = "A minimal HTTP and SOCKS5 proxy routed through the Tor network with local REST control API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Franz Haberfellner" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pyyaml>=6.0",
    "ruff>=0.1.0",
    "mypy>=1.9.0",
    "build>=1.2",
]

[project.scripts]
torproxy = "torproxy.runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: Hermetic unit tests without external network or daemon requirements",
    "smoke: Container smoke and lifecycle tests",
    "live: Live canary tests against the active Tor network",
]

[tool.coverage.run]
source = ["torproxy"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
files = ["src/torproxy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
