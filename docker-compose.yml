services:
  torproxy:
    image: hapheus/torproxy:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      TORPROXY_LISTEN_ADDRESS: ${TORPROXY_LISTEN_ADDRESS:-0.0.0.0}
      TORPROXY_LISTEN_PORT: ${TORPROXY_LISTEN_PORT:-8118}
      TORPROXY_API_PORT: ${TORPROXY_API_PORT:-8080}
      TORPROXY_SOCKS_PORT: ${TORPROXY_SOCKS_PORT:-9050}
      TORPROXY_COUNTRY: ${TORPROXY_COUNTRY:-}
      TORPROXY_EXIT_COUNTRY: ${TORPROXY_EXIT_COUNTRY:-}
      TORPROXY_EXIT_NODES: ${TORPROXY_EXIT_NODES:-}
      TORPROXY_STRICT_NODES: ${TORPROXY_STRICT_NODES:-}
      TORPROXY_API_TOKEN: ${TORPROXY_API_TOKEN:-}
      TORPROXY_API_ALLOW_ANONYMOUS_HEALTH: ${TORPROXY_API_ALLOW_ANONYMOUS_HEALTH:-}
    ports:
      - "127.0.0.1:${TORPROXY_HOST_PORT:-8118}:${TORPROXY_LISTEN_PORT:-8118}"
      - "127.0.0.1:${TORPROXY_API_PORT:-8080}:${TORPROXY_API_PORT:-8080}"
      - "127.0.0.1:${TORPROXY_SOCKS_PORT:-9050}:${TORPROXY_SOCKS_PORT:-9050}"
    restart: unless-stopped
