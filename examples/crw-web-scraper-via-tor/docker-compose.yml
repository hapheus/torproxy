services:
  torproxy:
    image: hapheus/torproxy:latest
    environment:
      TORPROXY_LISTEN_ADDRESS: 0.0.0.0
      TORPROXY_LISTEN_PORT: 8118
      TORPROXY_API_PORT: 8080
      TORPROXY_SOCKS_PORT: 9050
    restart: unless-stopped

  crw:
    image: ghcr.io/us/crw:latest
    depends_on:
      torproxy:
        condition: service_healthy
    environment:
      CRW_CRAWLER__PROXY: http://torproxy:8118
    ports:
      - "127.0.0.1:${CRW_HOST_PORT:-3000}:3000"
    restart: unless-stopped
