services:
  torproxy:
    image: hapheus/torproxy:latest
    environment:
      TORPROXY_LISTEN_ADDRESS: 0.0.0.0
      TORPROXY_LISTEN_PORT: 8118
      TORPROXY_API_PORT: 8080
      TORPROXY_SOCKS_PORT: 9050
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:latest
    depends_on:
      torproxy:
        condition: service_healthy
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-demo-secret-change-before-deployment}
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT:-8080}:8080"
    restart: unless-stopped
