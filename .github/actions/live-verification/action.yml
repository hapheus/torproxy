name: Live Image Verification
description: "Full live Tor canary suite (bootstrap, egress, rotation, gateway, GeoIP) against a locally built or published torproxy image. ISSUE-117: shared by PR gate, publish, release and daily canary so breakage is caught before publish, not after."
inputs:
  image_ref:
    description: "Image reference to test (local tag when build_local, registry reference otherwise)"
    required: true
  build_local:
    description: "Build the image from the checked-out Dockerfile instead of pulling image_ref ('true'/'false')"
    required: false
    default: "false"
  run_alerts:
    description: "Create/close canary-alert issues on failure/success ('true'/'false', daily canary only)"
    required: false
    default: "false"
  dockerhub_token:
    description: "Docker Hub token for rate-limit prevention (composite actions cannot access the secrets context)"
    required: false
    default: ""
runs:
  using: composite
  steps:
    # -------------------------------------------------------------
    # 1. Host baseline: determine runner IP to guard against leaks
    # -------------------------------------------------------------
    - name: Determine Host IP
      id: host-info
      shell: bash
      run: |
        RUNNER_IP=$(curl -s --connect-timeout 10 --max-time 15 https://api.ipify.org || curl -s --connect-timeout 10 --max-time 15 https://icanhazip.com)
        echo "Host Runner IP: $RUNNER_IP"
        echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

    - name: Log in to Docker Hub (Rate Limit Prevention)
      if: inputs.dockerhub_token != ''
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: docker.io
        username: hapheus
        password: ${{ inputs.dockerhub_token }}

    # -------------------------------------------------------------
    # 2. Build the image from source or pull the published image
    # -------------------------------------------------------------
    - name: Build Image From Source
      if: inputs.build_local == 'true'
      shell: bash
      run: |
        echo "Building Docker Image: ${{ inputs.image_ref }}..."
        docker build -f docker/Dockerfile -t "${{ inputs.image_ref }}" .

    - name: Pull Published Image
      if: inputs.build_local != 'true'
      shell: bash
      run: |
        echo "Pulling Docker Image: ${{ inputs.image_ref }}..."
        docker pull "${{ inputs.image_ref }}"

    - name: Start torproxy Container
      id: run-container
      shell: bash
      run: |
        echo "Starting Container..."
        CONTAINER_ID=$(docker run -d \
          --name torproxy-canary \
          -p 8118:8118 \
          -p 9050:9050 \
          -p 8080:8080 \
          "${{ inputs.image_ref }}")
        echo "container_id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"

    # -------------------------------------------------------------
    # 3. Live verification: wait for 100% Tor bootstrap (SLA: max 180s)
    # -------------------------------------------------------------
    - name: Wait for Tor 100% Bootstrap
      shell: bash
      run: |
        echo "Waiting for Tor Bootstrap via REST API (http://localhost:8080/status)..."
        BOOTSTRAPPED=false
        for i in {1..36}; do
          STATUS_JSON=$(curl -s --connect-timeout 5 --max-time 10 http://localhost:8080/status || echo "{}")
          STATUS=$(echo "$STATUS_JSON" | jq -r '.status // "unknown"')
          DETAIL=$(echo "$STATUS_JSON" | jq -r '.detail // ""')

          echo "Attempt $i/36: Status='$STATUS', Detail='$DETAIL'"

          if [ "$STATUS" = "connected" ]; then
            echo "✅ Tor successfully bootstrapped and connected!"
            echo "Stabilizing Tor circuit pool for 5s..."
            sleep 5
            BOOTSTRAPPED=true
            break
          fi
          sleep 5
        done

        if [ "$BOOTSTRAPPED" != "true" ]; then
          echo "❌ Tor failed to bootstrap within 180s SLA window."
          exit 1
        fi

    # -------------------------------------------------------------
    # 4. HTTP proxy (Privoxy :8118) egress and anonymity check
    # -------------------------------------------------------------
    - name: Verify HTTP Proxy (Port 8118) Egress & Anonymity
      shell: bash
      run: |
        RUNNER_IP="${{ steps.host-info.outputs.runner_ip }}"
        echo "Testing Privoxy HTTP Proxy via http://127.0.0.1:8118..."

        RESP=""
        for attempt in 1 2 3 4; do
          echo "HTTP Proxy check attempt $attempt/4..."
          RESP=$(curl -sS --connect-timeout 15 --max-time 30 --retry 2 --retry-all-errors --proxy http://127.0.0.1:8118 https://check.torproject.org/api/ip 2>/dev/null || true)
          if [ -n "$RESP" ] && echo "$RESP" | jq -e '.IsTor' >/dev/null 2>&1; then
            break
          fi
          sleep 3
        done

        echo "Privoxy Response: $RESP"

        IS_TOR=$(echo "$RESP" | jq -r '.IsTor // empty')
        EXIT_IP=$(echo "$RESP" | jq -r '.IP // empty')

        if [ -z "$EXIT_IP" ]; then
          echo "⚠️ check.torproject.org unresponsive; checking fallback IP reflection via api.ipify.org..."
          EXIT_IP=$(curl -sS --connect-timeout 15 --max-time 30 --proxy http://127.0.0.1:8118 https://api.ipify.org 2>/dev/null || true)
        fi
        if [ -z "$EXIT_IP" ]; then
          echo "⚠️ api.ipify.org unresponsive; checking tertiary fallback via icanhazip.com..."
          EXIT_IP=$(curl -sS --connect-timeout 15 --max-time 30 --proxy http://127.0.0.1:8118 https://icanhazip.com 2>/dev/null | tr -d '[:space:]' || true)
        fi

        if [ -n "$EXIT_IP" ] && [ -z "$IS_TOR" ]; then
          if [ "$EXIT_IP" != "$RUNNER_IP" ]; then
            echo "✅ Fallback egress verified (IP=$EXIT_IP != Host=$RUNNER_IP)"
            IS_TOR="true"
          fi
        fi

        if [ "$EXIT_IP" = "$RUNNER_IP" ]; then
          echo "❌ CRITICAL: IP Leak detected! Exit IP matches Runner Host IP ($EXIT_IP)."
          exit 1
        fi

        if [ "$IS_TOR" = "false" ]; then
          echo "❌ CRITICAL: check.torproject.org explicitly reported traffic did NOT exit via Tor!"
          exit 1
        fi

        if [ -z "$EXIT_IP" ]; then
          echo "⚠️ External IP verification services unreachable; test is inconclusive due to external network conditions."
          echo "canary_inconclusive=true" >> "$GITHUB_ENV"
        else
          echo "✅ HTTP Proxy OK: Exit-IP is $EXIT_IP (IsTor=true, IP != Host)"
          echo "initial_http_ip=$EXIT_IP" >> "$GITHUB_ENV"
        fi

    # -------------------------------------------------------------
    # 5. SOCKS5 proxy (Tor :9050) egress and remote DNS check
    # -------------------------------------------------------------
    - name: Verify SOCKS5 Proxy (Port 9050) Egress & DNS Resolution
      shell: bash
      run: |
        RUNNER_IP="${{ steps.host-info.outputs.runner_ip }}"
        echo "Testing Tor SOCKS5 Proxy via socks5h://127.0.0.1:9050 (Remote DNS)..."

        RESP=""
        for attempt in 1 2 3 4; do
          echo "SOCKS5 Proxy check attempt $attempt/4..."
          RESP=$(curl -sS --connect-timeout 15 --max-time 30 --retry 2 --retry-all-errors --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip 2>/dev/null || true)
          if [ -n "$RESP" ] && echo "$RESP" | jq -e '.IsTor' >/dev/null 2>&1; then
            break
          fi
          sleep 3
        done

        echo "SOCKS5 Response: $RESP"

        IS_TOR=$(echo "$RESP" | jq -r '.IsTor // empty')
        EXIT_IP=$(echo "$RESP" | jq -r '.IP // empty')

        if [ -z "$EXIT_IP" ]; then
          echo "⚠️ check.torproject.org unresponsive; checking fallback IP reflection via api.ipify.org..."
          EXIT_IP=$(curl -sS --connect-timeout 15 --max-time 30 --socks5-hostname 127.0.0.1:9050 https://api.ipify.org 2>/dev/null || true)
        fi
        if [ -z "$EXIT_IP" ]; then
          echo "⚠️ api.ipify.org unresponsive; checking tertiary fallback via icanhazip.com..."
          EXIT_IP=$(curl -sS --connect-timeout 15 --max-time 30 --socks5-hostname 127.0.0.1:9050 https://icanhazip.com 2>/dev/null | tr -d '[:space:]' || true)
        fi

        if [ -n "$EXIT_IP" ] && [ -z "$IS_TOR" ]; then
          if [ "$EXIT_IP" != "$RUNNER_IP" ]; then
            echo "✅ Fallback SOCKS5 egress verified (IP=$EXIT_IP != Host=$RUNNER_IP)"
            IS_TOR="true"
          fi
        fi

        if [ "$EXIT_IP" = "$RUNNER_IP" ]; then
          echo "❌ CRITICAL: SOCKS5 IP Leak detected! Exit IP matches Runner Host IP ($EXIT_IP)."
          exit 1
        fi

        if [ "$IS_TOR" = "false" ]; then
          echo "❌ CRITICAL: check.torproject.org explicitly reported SOCKS5 traffic did NOT exit via Tor!"
          exit 1
        fi

        if [ -z "$EXIT_IP" ]; then
          echo "⚠️ SOCKS5 external verification services unreachable; test is inconclusive."
          echo "canary_inconclusive=true" >> "$GITHUB_ENV"
        else
          echo "✅ SOCKS5 Proxy OK: Exit-IP is $EXIT_IP (IsTor=true)"
        fi

    # -------------------------------------------------------------
    # 6. Circuit rotation (/reconnect -> SIGNAL NEWNYM)
    # -------------------------------------------------------------
    - name: Verify Circuit Rotation (/reconnect -> SIGNAL NEWNYM)
      shell: bash
      run: |
        OLD_IP="${{ env.initial_http_ip }}"
        echo "Current Exit IP before rotation: $OLD_IP"

        echo "Triggering IP reconnect via REST API..."
        RECONNECT_RESP=$(curl -sS --max-time 15 -X POST http://localhost:8080/reconnect || echo "{}")
        echo "Reconnect Response: $RECONNECT_RESP"

        # Tor ignores SIGNAL NEWNYM if sent again within 10 seconds
        echo "Waiting 15 seconds for new Tor circuit establishment..."
        sleep 15

        NEW_RESP=""
        for attempt in 1 2 3 4; do
          echo "Post-reconnect check attempt $attempt/4..."
          NEW_RESP=$(curl -sS --connect-timeout 15 --max-time 30 --retry 2 --retry-all-errors --proxy http://127.0.0.1:8118 https://check.torproject.org/api/ip 2>/dev/null || true)
          if [ -n "$NEW_RESP" ] && echo "$NEW_RESP" | jq -e '.IsTor' >/dev/null 2>&1; then
            break
          fi
          sleep 3
        done

        echo "New Check Response: $NEW_RESP"

        IS_TOR_NEW=$(echo "$NEW_RESP" | jq -r '.IsTor // empty')
        NEW_IP=$(echo "$NEW_RESP" | jq -r '.IP // empty')

        if [ -z "$NEW_IP" ]; then
          NEW_IP=$(curl -sS --connect-timeout 15 --max-time 30 --proxy http://127.0.0.1:8118 https://api.ipify.org 2>/dev/null || true)
        fi
        if [ -z "$NEW_IP" ]; then
          NEW_IP=$(curl -sS --connect-timeout 15 --max-time 30 --proxy http://127.0.0.1:8118 https://icanhazip.com 2>/dev/null | tr -d '[:space:]' || true)
        fi

        if [ -n "$NEW_IP" ] && [ "$NEW_IP" != "${{ steps.host-info.outputs.runner_ip }}" ]; then
          IS_TOR_NEW="true"
        fi

        if [ "$NEW_IP" = "${{ steps.host-info.outputs.runner_ip }}" ]; then
          echo "❌ CRITICAL: IP Leak detected after circuit rotation!"
          exit 1
        fi

        if [ "$IS_TOR_NEW" = "false" ]; then
          echo "❌ ERROR: Rotated circuit is NOT recognized as Tor traffic."
          exit 1
        fi

        echo "Initial IP: $OLD_IP"
        echo "New IP:     $NEW_IP"

        if [ "$NEW_IP" = "$OLD_IP" ]; then
          echo "⚠️ Warning: Exit IP unchanged after rotation ($NEW_IP). Note: Tor may select same exit node if circuit pool is small, but circuit was refreshed."
        else
          echo "✅ Circuit successfully rotated to new Exit-IP: $NEW_IP"
        fi

    # -------------------------------------------------------------
    # 6b. Transparent Tor Gateway Mode verification
    # -------------------------------------------------------------
    - name: Verify Transparent Tor Gateway Mode
      shell: bash
      run: |
        echo "Starting torproxy in Gateway Mode..."
        docker run -d \
          --name torproxy-canary-gateway \
          --cap-add=NET_ADMIN \
          -e TORPROXY_GATEWAY_MODE=true \
          -p 8089:8080 \
          "${{ inputs.image_ref }}"

        echo "Waiting for Gateway Tor bootstrap..."
        # ISSUE-19/117: poll over loopback INSIDE the container.
        # The published host port goes through the gateway kill
        # switch, so a host-side curl never observes "connected"
        # (the run in PR #118 burned 8m50s this way although Tor
        # itself bootstrapped in 8s). The whole wait is wall-clock
        # capped at 180s with bounded polls, like the PR gate.
        BOOTSTRAPPED=false
        START=$SECONDS
        while [ $((SECONDS - START)) -lt 180 ]; do
          # Bootstrap progress, not /status "connected": the latter
          # requires the external check.torproject.org egress probe,
          # whose intermittent unreachability flaked this step
          # although Tor itself bootstrapped in seconds (PR #121).
          PROGRESS=$(docker exec torproxy-canary-gateway curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/health 2>/dev/null | jq -r '.tor.progress // empty' || true)
          if [ "$PROGRESS" = "100" ]; then
            echo "✅ Gateway Tor successfully connected!"
            BOOTSTRAPPED=true
            break
          fi
          sleep 5
        done
        if [ "$BOOTSTRAPPED" != "true" ]; then
          echo "❌ Gateway Tor did not bootstrap within 180s; container logs:"
          docker logs torproxy-canary-gateway || true
          docker rm -f torproxy-canary-gateway || true
          exit 1
        fi

        chmod +x tests/integration/verify_gateway.sh
        ./tests/integration/verify_gateway.sh torproxy-canary-gateway
        docker rm -f torproxy-canary-gateway

    # -------------------------------------------------------------
    # 6c. GeoIP upstream drift guard + auto-update verification
    # -------------------------------------------------------------
    - name: Verify GeoIP Upstream Size Drift Guard
      shell: bash
      run: |
        # ISSUE-117: fail fast when an upstream GeoIP file outgrows
        # its configured size limit (deterministic, no Tor needed).
        # The limits come from the shipped defaults, not from a copy
        # of the numbers in this workflow.
        read GEOIP_URL GEOIP6_URL GEOIP_MAX GEOIP6_MAX < <(PYTHONPATH=src python3 -c "from torproxy.configuration import Settings; s=Settings.from_mapping({}); print(s.geoip_url, s.geoip6_url, s.geoip_max_bytes, s.geoip6_max_bytes)")
        echo "geoip:  $GEOIP_URL (max $GEOIP_MAX bytes)"
        echo "geoip6: $GEOIP6_URL (max $GEOIP6_MAX bytes)"
        for spec in "geoip|$GEOIP_URL|$GEOIP_MAX" "geoip6|$GEOIP6_URL|$GEOIP6_MAX"; do
          name="${spec%%|*}"; rest="${spec#*|}"; url="${rest%%|*}"; max="${rest##*|}"
          length=$(curl -fsSI --connect-timeout 10 --max-time 30 "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-length"{print $2; exit}')
          if [ -z "$length" ]; then
            echo "❌ Could not read Content-Length for $name upstream ($url)"
            exit 1
          fi
          echo "$name upstream Content-Length: $length bytes (limit $max)"
          if [ "$length" -gt "$max" ]; then
            echo "❌ $name upstream exceeds TORPROXY_GEOIP${name#geoip}_MAX_BYTES limit ($length > $max). Raise the default limit."
            exit 1
          fi
        done
        echo "✅ GeoIP upstream sizes fit the configured limits"

    - name: Verify GeoIP Database Availability & Auto-Update
      shell: bash
      run: |
        echo "Checking upstream GeoIP URLs are reachable..."
        GEOIP_URL="https://gitlab.torproject.org/tpo/core/tor/-/raw/main/src/config/geoip"
        GEOIP6_URL="https://gitlab.torproject.org/tpo/core/tor/-/raw/main/src/config/geoip6"
        curl -fsSL --connect-timeout 10 --max-time 30 -o /dev/null "$GEOIP_URL" || { echo "❌ GeoIP (IPv4) upstream unavailable: $GEOIP_URL"; exit 1; }
        curl -fsSL --connect-timeout 10 --max-time 30 -o /dev/null "$GEOIP6_URL" || { echo "❌ GeoIP (IPv6) upstream unavailable: $GEOIP6_URL"; exit 1; }
        echo "✅ GeoIP upstream URLs reachable"

        echo "Starting torproxy with GeoIP auto-update + country routing..."
        docker run -d \
          --name torproxy-canary-geoip \
          -e TORPROXY_GEOIP_AUTO_UPDATE=1 \
          -e TORPROXY_COUNTRY=DE \
          -p 8087:8080 \
          "${{ inputs.image_ref }}"

        echo "Waiting for GeoIP files to be downloaded inside container..."
        GEOIP_OK=false
        for i in $(seq 1 30); do
          if docker exec torproxy-canary-geoip sh -c 'test -s /var/lib/tor/geoip/geoip && test -s /var/lib/tor/geoip/geoip6'; then
            GEOIP_OK=true
            break
          fi
          sleep 2
        done
        if [ "$GEOIP_OK" != "true" ]; then
          echo "❌ GeoIP auto-update did not download databases inside container"
          docker logs torproxy-canary-geoip || true
          exit 1
        fi
        echo "✅ GeoIP databases downloaded inside container"

        echo "Waiting for Tor bootstrap with downloaded GeoIP DB..."
        BOOTSTRAPPED=false
        for i in $(seq 1 36); do
          STATUS_JSON=$(curl -s --connect-timeout 5 --max-time 10 http://localhost:8087/status || echo "{}")
          STATUS=$(echo "$STATUS_JSON" | jq -r '.status // empty')
          if [ "$STATUS" = "connected" ]; then
            BOOTSTRAPPED=true
            echo "✅ Tor connected with downloaded GeoIP DB"
            SOURCE=$(echo "$STATUS_JSON" | jq -r '.geoip.source // "unknown"')
            if [ "$SOURCE" != "downloaded" ]; then
              echo "❌ /status geoip.source is '$SOURCE', expected 'downloaded' (silent fallback!)"
              exit 1
            fi
            break
          fi
          sleep 5
        done
        if [ "$BOOTSTRAPPED" != "true" ]; then
          echo "❌ Tor failed to bootstrap with GeoIP auto-update enabled"
          exit 1
        fi
        docker rm -f torproxy-canary-geoip

    # -------------------------------------------------------------
    # 7. Generate Step Summary
    # -------------------------------------------------------------
    - name: Generate Step Summary
      if: always()
      shell: bash
      run: |
        echo "### 🛡️ Live Image Verification Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Image:** \`${{ inputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Runner Host IP:** \`${{ steps.host-info.outputs.runner_ip }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Initial Tor Exit IP:** \`${{ env.initial_http_ip || 'N/A' }}\`" >> "$GITHUB_STEP_SUMMARY"
        if [ "${{ env.canary_inconclusive }}" = "true" ]; then
          echo "- **Result:** ⚠️ INCONCLUSIVE (External verification APIs unreachable; no IP leak detected)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "- **Result:** see job result (composite action: job.status is not available here)" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Dump Container Logs on Failure
      if: failure()
      shell: bash
      run: |
        echo "=== torproxy-canary Docker Logs ==="
        docker logs torproxy-canary || true
        echo "=== torproxy-canary-geoip Docker Logs ==="
        docker logs torproxy-canary-geoip || true

    # -------------------------------------------------------------
    # 8. Stop and clean up container
    # -------------------------------------------------------------
    - name: Cleanup Container
      if: always()
      shell: bash
      run: |
        echo "Stopping and cleaning up container..."
        docker stop torproxy-canary torproxy-canary-gateway torproxy-canary-geoip || true
        docker rm torproxy-canary torproxy-canary-gateway torproxy-canary-geoip || true

    # -------------------------------------------------------------
    # 9. Failure Notification: create or update Issue (daily only)
    # -------------------------------------------------------------
    - name: Alert on Failure (Create/Update Issue)
      if: inputs.run_alerts == 'true' && failure() && env.canary_inconclusive != 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const issueTitle = '🚨 Daily Live Image Verification Failed';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = `### 🚨 Daily Canary Failure Detected\n\nThe scheduled daily verification of \`${{ inputs.image_ref }}\` failed.\n\n- **Run:** [View Action Run](${runUrl})\n- **Date:** ${new Date().toISOString()}\n- **Cause:** Bootstrap timeout, proxy failure, or Tor network / Directory Authority outage.\n\nPlease check the workflow logs for container output and exit status.`;

          // Check if open issue already exists to avoid spamming
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['canary-alert']
          });

          if (issues.length > 0) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issues[0].number,
              body: `⚠️ Another failure was detected on ${new Date().toISOString()}.\n[View Run](${runUrl})`
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: body,
              labels: ['canary-alert', 'bug', 'priority/p1-urgent']
            });
          }

    # -------------------------------------------------------------
    # 10. Auto-resolve Open Canary Alerts on Success (daily only)
    # -------------------------------------------------------------
    - name: Auto-Resolve Open Canary Alerts
      if: inputs.run_alerts == 'true' && success()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['canary-alert']
          });

          for (const issue of issues) {
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ Canary verification passed successfully in [Run #${context.runId}](${runUrl}). Automatically closing alert.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
          }
