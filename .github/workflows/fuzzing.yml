name: Continuous Fuzz Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly fuzz campaign every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'

permissions: read-all

jobs:
  fuzz:
    name: Fuzz Tor Control & Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Standalone Fuzz Harness
        run: |
          python scripts/fuzz_tor_control.py
