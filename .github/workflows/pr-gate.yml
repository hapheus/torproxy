name: "PR Quality & Smoke Gate"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: "Lint & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy .[dev]

      - name: Run Ruff Linter & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Checker
        run: |
          mypy

      - name: Validate Shell Script Syntax
        run: |
          bash -n docker/start.sh
          bash -n docker/healthcheck.sh
          bash -n tests/integration/verify_container.sh

      - name: Run ShellCheck
        run: |
          shellcheck docker/start.sh
          shellcheck docker/healthcheck.sh
          shellcheck tests/integration/verify_container.sh

  unit-tests:
    name: "Hermetic Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Pytest (Hermetic Unit Tests with Coverage)
        run: |
          pytest tests/unit/ -v --cov=torproxy --cov-report=term-missing --cov-report=xml --cov-fail-under=85

  docker-smoke:
    name: "Docker Build & Container Smoke Test"
    runs-on: ubuntu-latest
    needs: [lint-and-validate, unit-tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Log in to Docker Hub (Rate Limit Exemption)
        uses: docker/login-action@v4
        if: env.DOCKERHUB_TOKEN != ''
        with:
          registry: docker.io
          username: hapheus
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          BUILD_SUCCESS=false
          for i in {1..5}; do
            echo "Attempt $i: Building Docker image..."
            if docker build -f docker/Dockerfile -t torproxy:smoke-test .; then
              BUILD_SUCCESS=true
              break
            fi
            echo "Build failed (possibly Docker Hub rate limit 429). Retrying in 10s..."
            sleep 10
          done
          if [ "$BUILD_SUCCESS" != "true" ]; then
            echo "❌ Failed to build Docker image after 5 attempts."
            exit 1
          fi

      - name: Run Container for Smoke Test
        id: run-container
        run: |
          CONTAINER_ID=$(docker run -d \
            --name torproxy-smoke \
            -p 8118:8118 \
            -p 9050:9050 \
            -p 8080:8080 \
            torproxy:smoke-test)
          echo "container_id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"
          # Brief sleep to allow processes to start
          sleep 4

      - name: Verify Non-Root User Execution
        run: |
          CONTAINER_UID=$(docker exec torproxy-smoke id -u)
          echo "Container User UID: $CONTAINER_UID"
          if [ "$CONTAINER_UID" -eq 0 ]; then
            echo "❌ CRITICAL SECURITY ERROR: Container is running as root (UID 0)!"
            exit 1
          fi
          echo "✅ Container is running as non-root user (UID: $CONTAINER_UID)."

      - name: Verify Daemon Processes
        run: |
          PROCS=$(docker top torproxy-smoke)
          echo "$PROCS"
          echo "$PROCS" | grep -q "tor" || (echo "❌ tor daemon is not running" && exit 1)
          echo "$PROCS" | grep -q "privoxy" || (echo "❌ privoxy is not running" && exit 1)
          echo "$PROCS" | grep -q "python3" || (echo "❌ API process is not running" && exit 1)
          echo "✅ All required daemons (tor, privoxy, api.py) are running."

      - name: Run Multi-Port Integration & Fail-Closed Tests
        run: |
          chmod +x tests/integration/verify_container.sh
          ./tests/integration/verify_container.sh torproxy-smoke 8080 8118 9050

      - name: Run Pytest Integration Suite
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pytest tests/integration/ -v -m smoke

      - name: Verify Graceful Shutdown
        run: |
          echo "Stopping container with 5s timeout to test SIGTERM handling..."
          STOP_START=$(date +%s)
          docker stop -t 5 torproxy-smoke
          STOP_END=$(date +%s)
          STOP_DURATION=$((STOP_END - STOP_START))
          echo "Container stopped in $STOP_DURATION seconds."
          if [ "$STOP_DURATION" -ge 10 ]; then
            echo "❌ Container failed graceful shutdown within timeout (was SIGKILLed)."
            exit 1
          fi
          echo "✅ Graceful shutdown successful."

      - name: Verify Docker Compose Compatibility
        run: |
          echo "Testing standard docker-compose.yml startup..."
          docker compose up -d --build
          sleep 5
          COMPOSE_CONTAINER=$(docker compose ps -q torproxy)
          echo "Compose container ID: $COMPOSE_CONTAINER"
          ./tests/integration/verify_container.sh "$COMPOSE_CONTAINER" 8080 8118 9050
          docker compose down -v
          echo "✅ Compose backward compatibility verified."

      - name: Verify Hardened Container Execution (Dropped Caps & No-New-Privileges)
        run: |
          echo "Testing container startup with dropped capabilities and no-new-privileges..."
          HARDENED_ID=$(docker run -d \
            --name torproxy-hardened-test \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -p 8119:8118 \
            -p 9051:9050 \
            -p 8081:8080 \
            torproxy:smoke-test)
          sleep 5
          ./tests/integration/verify_container.sh "$HARDENED_ID" 8081 8119 9051
          docker rm -f "$HARDENED_ID"
          echo "✅ Hardened container startup and routing verified."

      - name: Verify Backward Compatible Upgrade from Prior Release
        run: |
          echo "Testing upgrade from previous release with unchanged Compose configuration..."
          # Test running previous published image
          docker run -d --name torproxy-prev -p 8120:8118 -p 8082:8080 hapheus/torproxy:latest || true
          sleep 5
          if [ "$(docker ps -q -f name=torproxy-prev)" ]; then
            curl -s http://127.0.0.1:8082/status || true
            docker rm -f torproxy-prev
          fi
          # Test running candidate image on the exact same port mapping
          docker run -d --name torproxy-upgrade -p 8120:8118 -p 8082:8080 torproxy:smoke-test
          sleep 5
          curl -s http://127.0.0.1:8082/status | grep -q "status"
          docker rm -f torproxy-upgrade
          echo "✅ Upgrade compatibility verified."

      - name: Install and Run Trivy Vulnerability Scanner
        run: |
          echo "Installing Trivy security scanner..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          echo "Scanning container image torproxy:smoke-test for vulnerabilities..."
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 torproxy:smoke-test

      - name: Cleanup Containers
        if: always()
        run: |
          docker rm -f torproxy-smoke torproxy-hardened-test torproxy-prev torproxy-upgrade || true
          docker compose down -v || true
