name: Release

# Triggers when a new version tag (e.g., v2.1.0) is pushed.
#
# Note on release architecture & branch protection:
# - Docker image publishing is handled exclusively by `publish-dockerhub.yml`.
# - To respect branch protection on `main` and prevent workflow loops or
#   desynchronized tag-versus-changelog history, CHANGELOG.md is maintained
#   and reviewed via release PRs on release branches before tagging.
# - This workflow generates the release-specific notes deterministically using
#   `git-cliff` and publishes the official GitHub Release for the tag.
# - ISSUE-117: the GitHub Release is only created after the same live
#   Tor verification that gates publishing has passed for this tag, so a
#   broken image can no longer ship as an official release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify-live:
    name: "Live Image Verification (Pre-Release Gate)"
    uses: ./.github/workflows/live-image-verification.yml
    with:
      image_ref: "torproxy:smoke-test"
      build_local: true
      run_alerts: false
    permissions:
      contents: read

  github-release:
    name: "Generate Changelog & Publish GitHub Release"
    needs: verify-live
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository (full git history for tag analysis)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Changelog with git-cliff
        id: cliff
        uses: orhun/git-cliff-action@4a4a951bc43fafe41cd2348d181853f52356bee7 # v4.4.2
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
