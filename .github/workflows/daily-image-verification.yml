name: "Daily Live Image Verification"

on:
  schedule:
    # Daily at 04:00 UTC (before European business hours)
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker Image Tag to test (default: latest)"
        required: true
        default: "latest"
  workflow_run:
    workflows: ["Publish Docker image"]
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  live-verification:
    name: "Live Tor Canary Verification"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1. Host baseline: determine runner IP to guard against leaks
      # -------------------------------------------------------------
      - name: Determine Host IP
        id: host-info
        run: |
          RUNNER_IP=$(curl -s --connect-timeout 10 https://api.ipify.org || curl -s --connect-timeout 10 https://icanhazip.com)
          echo "Host Runner IP: $RUNNER_IP"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub (Rate Limit Prevention)
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: hapheus
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------------
      # 2. Pull and start container
      # -------------------------------------------------------------
      - name: Pull and Run torproxy Container
        id: run-container
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag || 'latest' }}"
          IMAGE_NAME="hapheus/torproxy:${IMAGE_TAG}"
          echo "Pulling Docker Image: $IMAGE_NAME..."
          docker pull "$IMAGE_NAME"

          echo "Starting Container..."
          CONTAINER_ID=$(docker run -d \
            --name torproxy-canary \
            -p 8118:8118 \
            -p 9050:9050 \
            -p 8080:8080 \
            "$IMAGE_NAME")
          echo "container_id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------
      # 3. Live verification: wait for 100% Tor bootstrap (SLA: max 180s)
      # -------------------------------------------------------------
      - name: Wait for Tor 100% Bootstrap
        timeout-minutes: 4
        run: |
          echo "Waiting for Tor Bootstrap via REST API (http://localhost:8080/status)..."
          BOOTSTRAPPED=false
          for i in {1..36}; do
            STATUS_JSON=$(curl -s --connect-timeout 5 http://localhost:8080/status || echo "{}")
            STATUS=$(echo "$STATUS_JSON" | jq -r '.status // "unknown"')
            DETAIL=$(echo "$STATUS_JSON" | jq -r '.detail // ""')

            echo "Attempt $i/36: Status='$STATUS', Detail='$DETAIL'"

            if [ "$STATUS" = "connected" ]; then
              echo "✅ Tor successfully bootstrapped and connected!"
              echo "Stabilizing Tor circuit pool for 5s..."
              sleep 5
              BOOTSTRAPPED=true
              break
            fi
            sleep 5
          done

          if [ "$BOOTSTRAPPED" != "true" ]; then
            echo "❌ Tor failed to bootstrap within 180s SLA window."
            exit 1
          fi

      # -------------------------------------------------------------
      # 4. HTTP proxy (Privoxy :8118) egress and anonymity check
      # -------------------------------------------------------------
      - name: Verify HTTP Proxy (Port 8118) Egress & Anonymity
        run: |
          RUNNER_IP="${{ steps.host-info.outputs.runner_ip }}"
          echo "Testing Privoxy HTTP Proxy via http://127.0.0.1:8118..."

          RESP=""
          for attempt in 1 2 3 4; do
            echo "HTTP Proxy check attempt $attempt/4..."
            RESP=$(curl -sS --connect-timeout 15 --max-time 30 --retry 2 --retry-all-errors --proxy http://127.0.0.1:8118 https://check.torproject.org/api/ip 2>/dev/null || true)
            if [ -n "$RESP" ] && echo "$RESP" | jq -e '.IsTor' >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done

          echo "Privoxy Response: $RESP"

          IS_TOR=$(echo "$RESP" | jq -r '.IsTor // empty')
          EXIT_IP=$(echo "$RESP" | jq -r '.IP // empty')

          if [ -z "$EXIT_IP" ]; then
            echo "⚠️ check.torproject.org unresponsive; checking fallback IP reflection via api.ipify.org..."
            EXIT_IP=$(curl -sS --connect-timeout 15 --max-time 30 --proxy http://127.0.0.1:8118 https://api.ipify.org 2>/dev/null || true)
          fi
          if [ -z "$EXIT_IP" ]; then
            echo "⚠️ api.ipify.org unresponsive; checking tertiary fallback via icanhazip.com..."
            EXIT_IP=$(curl -sS --connect-timeout 15 --max-time 30 --proxy http://127.0.0.1:8118 https://icanhazip.com 2>/dev/null | tr -d '[:space:]' || true)
          fi

          if [ -n "$EXIT_IP" ] && [ -z "$IS_TOR" ]; then
            if [ "$EXIT_IP" != "$RUNNER_IP" ]; then
              echo "✅ Fallback egress verified (IP=$EXIT_IP != Host=$RUNNER_IP)"
              IS_TOR="true"
            fi
          fi

          if [ "$EXIT_IP" = "$RUNNER_IP" ]; then
            echo "❌ CRITICAL: IP Leak detected! Exit IP matches Runner Host IP ($EXIT_IP)."
            exit 1
          fi

          if [ "$IS_TOR" = "false" ]; then
            echo "❌ CRITICAL: check.torproject.org explicitly reported traffic did NOT exit via Tor!"
            exit 1
          fi

          if [ -z "$EXIT_IP" ]; then
            echo "⚠️ External IP verification services unreachable; test is inconclusive due to external network conditions."
            echo "canary_inconclusive=true" >> "$GITHUB_ENV"
          else
            echo "✅ HTTP Proxy OK: Exit-IP is $EXIT_IP (IsTor=true, IP != Host)"
            echo "initial_http_ip=$EXIT_IP" >> "$GITHUB_ENV"
          fi

      # -------------------------------------------------------------
      # 5. SOCKS5 proxy (Tor :9050) egress and remote DNS check
      # -------------------------------------------------------------
      - name: Verify SOCKS5 Proxy (Port 9050) Egress & DNS Resolution
        run: |
          RUNNER_IP="${{ steps.host-info.outputs.runner_ip }}"
          echo "Testing Tor SOCKS5 Proxy via socks5h://127.0.0.1:9050 (Remote DNS)..."

          RESP=""
          for attempt in 1 2 3 4; do
            echo "SOCKS5 Proxy check attempt $attempt/4..."
            RESP=$(curl -sS --connect-timeout 15 --max-time 30 --retry 2 --retry-all-errors --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip 2>/dev/null || true)
            if [ -n "$RESP" ] && echo "$RESP" | jq -e '.IsTor' >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done

          echo "SOCKS5 Response: $RESP"

          IS_TOR=$(echo "$RESP" | jq -r '.IsTor // empty')
          EXIT_IP=$(echo "$RESP" | jq -r '.IP // empty')

          if [ -z "$EXIT_IP" ]; then
            echo "⚠️ check.torproject.org unresponsive; checking fallback IP reflection via api.ipify.org..."
            EXIT_IP=$(curl -sS --connect-timeout 15 --max-time 30 --socks5-hostname 127.0.0.1:9050 https://api.ipify.org 2>/dev/null || true)
          fi
          if [ -z "$EXIT_IP" ]; then
            echo "⚠️ api.ipify.org unresponsive; checking tertiary fallback via icanhazip.com..."
            EXIT_IP=$(curl -sS --connect-timeout 15 --max-time 30 --socks5-hostname 127.0.0.1:9050 https://icanhazip.com 2>/dev/null | tr -d '[:space:]' || true)
          fi

          if [ -n "$EXIT_IP" ] && [ -z "$IS_TOR" ]; then
            if [ "$EXIT_IP" != "$RUNNER_IP" ]; then
              echo "✅ Fallback SOCKS5 egress verified (IP=$EXIT_IP != Host=$RUNNER_IP)"
              IS_TOR="true"
            fi
          fi

          if [ "$EXIT_IP" = "$RUNNER_IP" ]; then
            echo "❌ CRITICAL: SOCKS5 IP Leak detected! Exit IP matches Runner Host IP ($EXIT_IP)."
            exit 1
          fi

          if [ "$IS_TOR" = "false" ]; then
            echo "❌ CRITICAL: check.torproject.org explicitly reported SOCKS5 traffic did NOT exit via Tor!"
            exit 1
          fi

          if [ -z "$EXIT_IP" ]; then
            echo "⚠️ SOCKS5 external verification services unreachable; test is inconclusive."
            echo "canary_inconclusive=true" >> "$GITHUB_ENV"
          else
            echo "✅ SOCKS5 Proxy OK: Exit-IP is $EXIT_IP (IsTor=true)"
          fi

      # -------------------------------------------------------------
      # 6. Circuit rotation (/reconnect -> SIGNAL NEWNYM)
      # -------------------------------------------------------------
      - name: Verify Circuit Rotation (/reconnect -> SIGNAL NEWNYM)
        run: |
          OLD_IP="${{ env.initial_http_ip }}"
          echo "Current Exit IP before rotation: $OLD_IP"

          echo "Triggering IP reconnect via REST API..."
          RECONNECT_RESP=$(curl -sS -X POST http://localhost:8080/reconnect || echo "{}")
          echo "Reconnect Response: $RECONNECT_RESP"

          # Tor ignores SIGNAL NEWNYM if sent again within 10 seconds
          echo "Waiting 15 seconds for new Tor circuit establishment..."
          sleep 15

          NEW_RESP=""
          for attempt in 1 2 3 4; do
            echo "Post-reconnect check attempt $attempt/4..."
            NEW_RESP=$(curl -sS --connect-timeout 15 --max-time 30 --retry 2 --retry-all-errors --proxy http://127.0.0.1:8118 https://check.torproject.org/api/ip 2>/dev/null || true)
            if [ -n "$NEW_RESP" ] && echo "$NEW_RESP" | jq -e '.IsTor' >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done

          echo "New Check Response: $NEW_RESP"

          IS_TOR_NEW=$(echo "$NEW_RESP" | jq -r '.IsTor // empty')
          NEW_IP=$(echo "$NEW_RESP" | jq -r '.IP // empty')

          if [ -z "$NEW_IP" ]; then
            NEW_IP=$(curl -sS --connect-timeout 15 --max-time 30 --proxy http://127.0.0.1:8118 https://api.ipify.org 2>/dev/null || true)
          fi
          if [ -z "$NEW_IP" ]; then
            NEW_IP=$(curl -sS --connect-timeout 15 --max-time 30 --proxy http://127.0.0.1:8118 https://icanhazip.com 2>/dev/null | tr -d '[:space:]' || true)
          fi

          if [ -n "$NEW_IP" ] && [ "$NEW_IP" != "${{ steps.host-info.outputs.runner_ip }}" ]; then
            IS_TOR_NEW="true"
          fi

          if [ "$NEW_IP" = "${{ steps.host-info.outputs.runner_ip }}" ]; then
            echo "❌ CRITICAL: IP Leak detected after circuit rotation!"
            exit 1
          fi

          if [ "$IS_TOR_NEW" = "false" ]; then
            echo "❌ ERROR: Rotated circuit is NOT recognized as Tor traffic."
            exit 1
          fi

          echo "Initial IP: $OLD_IP"
          echo "New IP:     $NEW_IP"

          if [ "$NEW_IP" = "$OLD_IP" ]; then
            echo "⚠️ Warning: Exit IP unchanged after rotation ($NEW_IP). Note: Tor may select same exit node if circuit pool is small, but circuit was refreshed."
          else
            echo "✅ Circuit successfully rotated to new Exit-IP: $NEW_IP"
          fi

      # -------------------------------------------------------------
      # 7. Generate Step Summary
      # -------------------------------------------------------------
      - name: Generate Step Summary
        if: always()
        run: |
          echo "### 🛡️ Daily Torproxy Canary Verification Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`hapheus/torproxy:${{ github.event.inputs.image_tag || 'latest' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runner Host IP:** \`${{ steps.host-info.outputs.runner_ip }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Initial Tor Exit IP:** \`${{ env.initial_http_ip || 'N/A' }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ env.canary_inconclusive }}" = "true" ]; then
            echo "- **Result:** ⚠️ INCONCLUSIVE (External verification APIs unreachable; no IP leak detected)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Result:** ${{ job.status == 'success' && '✅ PASSED' || '❌ FAILED' }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          echo "=== torproxy-canary Docker Logs ==="
          docker logs torproxy-canary || true

      # -------------------------------------------------------------
      # 8. Stop and clean up container
      # -------------------------------------------------------------
      - name: Cleanup Container
        if: always()
        run: |
          echo "Stopping and cleaning up container..."
          docker stop torproxy-canary || true
          docker rm torproxy-canary || true

      # -------------------------------------------------------------
      # 9. Failure Notification: create or update Issue
      # -------------------------------------------------------------
      - name: Alert on Failure (Create/Update Issue)
        if: failure() && env.canary_inconclusive != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = '🚨 Daily Live Image Verification Failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### 🚨 Daily Canary Failure Detected\n\nThe scheduled daily verification of \`hapheus/torproxy:${{ github.event.inputs.image_tag || 'latest' }}\` failed.\n\n- **Run:** [View Action Run](${runUrl})\n- **Date:** ${new Date().toISOString()}\n- **Cause:** Bootstrap timeout, proxy failure, or Tor network / Directory Authority outage.\n\nPlease check the workflow logs for container output and exit status.`;

            // Check if open issue already exists to avoid spamming
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['canary-alert']
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `⚠️ Another failure was detected on ${new Date().toISOString()}.\n[View Run](${runUrl})`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: body,
                labels: ['canary-alert', 'bug', 'priority/p1-urgent']
              });
            }

      # -------------------------------------------------------------
      # 10. Auto-resolve Open Canary Alerts on Success
      # -------------------------------------------------------------
      - name: Auto-Resolve Open Canary Alerts
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['canary-alert']
            });

            for (const issue of issues) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Canary verification passed successfully in [Run #${context.runId}](${runUrl}). Automatically closing alert.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
