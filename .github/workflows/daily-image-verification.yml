name: "Daily Live Image Verification"

# ISSUE-117: drift detector only. The same composite action already
# gates PRs, publish and release against a locally built image, so
# this daily run verifies the *published* image against upstream
# drift (GeoIP file growth, URL moves, Tor network outages) — it is
# no longer the first detection of a broken image.

on:
  schedule:
    # Daily at 04:00 UTC (before European business hours)
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker Image Tag to test (default: latest)"
        required: true
        default: "latest"
  workflow_run:
    workflows: ["Publish Docker image"]
    types:
      - completed

permissions: read-all

jobs:
  live-verification:
    name: "Live Tor Canary Verification"
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Live Image Verification
        uses: ./.github/actions/live-verification
        with:
          image_ref: "hapheus/torproxy:${{ github.event.inputs.image_tag || 'latest' }}"
          build_local: "false"
          run_alerts: "true"
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
