name: Publish to MCP Registry

# Triggers when a new version tag (e.g., v2.7.1) is pushed.
#
# Note on publishing architecture:
# - Gated strictly behind `verify-live` to prevent publishing untested configurations.
# - Uses GitHub Actions OIDC (`id-token: write`) to securely authenticate
#   under the repository namespace `io.github.hapheus/*` without static tokens.
# - Validates `server.json` before publishing.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify-live:
    name: "Live Image Verification (Pre-Publish Gate)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Live Image Verification
        uses: ./.github/actions/live-verification
        with:
          image_ref: "torproxy:smoke-test"
          build_local: "true"
          run_alerts: "false"
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-mcp:
    name: "Publish to MCP Registry"
    needs: verify-live
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Wait for OCI image to become available in registry
        run: |
          IMAGE=$(jq -r '.packages[0].identifier' server.json)
          echo "Checking registry for OCI image $IMAGE..."
          FOUND=false
          for i in {1..30}; do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "✅ $IMAGE is available in the container registry."
              FOUND=true
              break
            fi
            echo "Attempt $i/30: $IMAGE not yet found in registry, waiting 15s..."
            sleep 15
          done
          if [ "$FOUND" != "true" ]; then
            echo "❌ Timed out waiting for $IMAGE in registry."
            exit 1
          fi

      - name: Authenticate with MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: ./mcp-publisher publish server.json
