# git-cliff configuration for torproxy
# https://git-cliff.org/docs/configuration
#
# Follows Keep a Changelog 1.1.0 and Semantic Versioning 2.0.0.

[changelog]
header = """
# Changelog

All notable changes to `torproxy` are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

---
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""

trim = true

footer = """
---

{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/releases/tag/{{ release.version }}
{% endif -%}
{% else -%}
[Unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor %}
"""

[git]
conventional_commits = true
filter_unconventional = false

commit_preprocessors = [
    { pattern = '\(deps\)\(deps\)', replace = "(deps)" },
]

commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactored" },
    { message = "^doc", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI" },
    { message = "^chore", group = "Chore" },
    # Historical commits prior to Conventional Commits standardization
    { message = "^Add SOCKS5", group = "Added" },
    { message = "^Add Browserless", group = "Added" },
    { message = "^Add CRW", group = "Added" },
    { message = "^Give Tor", group = "Fixed" },
    # Skip merge commits
    { message = "^Merge", skip = true },
    # Final fallback parser for any remaining commits
    { message = ".*", group = "Other" },
]

protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "hapheus"
repo = "torproxy"
